<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700" width="100%" height="100%">
  <defs>
    <radialGradient id="cosmicGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5C46B" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#52FEB8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0C0E15" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="goldCrease" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE192"/>
      <stop offset="50%" stop-color="#E5C46B"/>
      <stop offset="100%" stop-color="#B38F39"/>
    </linearGradient>
    <linearGradient id="jadeCrease" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7AFFD1"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="700" fill="#0C0E15"/>
  <circle cx="400" cy="350" r="320" fill="url(#cosmicGlow)"/>

  <!-- Biometric Grid Mesh -->
  <g stroke="rgba(229,196,107,0.08)" stroke-width="1" stroke-dasharray="4,4">
    <line x1="100" y1="100" x2="700" y2="100"/>
    <line x1="100" y1="220" x2="700" y2="220"/>
    <line x1="100" y1="350" x2="700" y2="350"/>
    <line x1="100" y1="480" x2="700" y2="480"/>
    <line x1="100" y1="600" x2="700" y2="600"/>
    <line x1="200" y1="50" x2="200" y2="650"/>
    <line x1="330" y1="50" x2="330" y2="650"/>
    <line x1="460" y1="50" x2="460" y2="650"/>
    <line x1="590" y1="50" x2="590" y2="650"/>
  </g>

  <!-- Astrological Concentric Ring -->
  <circle cx="400" cy="380" r="240" fill="none" stroke="rgba(229,196,107,0.15)" stroke-width="1.5"/>
  <circle cx="400" cy="380" r="260" fill="none" stroke="rgba(82,254,184,0.12)" stroke-width="1" stroke-dasharray="6,8"/>

  <!-- Stylized Biometric Palm Contour (Left Hand) -->
  <path d="M 330 630 
           C 310 590, 260 520, 240 450
           C 220 380, 200 340, 160 300
           C 145 285, 140 260, 155 245
           C 170 230, 195 235, 220 265
           C 245 295, 270 335, 290 350
           C 285 300, 280 200, 285 140
           C 287 115, 305 105, 320 110
           C 335 115, 340 135, 342 165
           C 345 210, 345 270, 350 310
           C 355 260, 360 160, 375 90
           C 380 65, 400 60, 415 65
           C 430 70, 435 90, 435 120
           C 435 180, 430 250, 432 305
           C 440 260, 450 175, 470 125
           C 475 105, 495 100, 510 105
           C 525 110, 530 130, 525 160
           C 515 220, 505 285, 505 330
           C 515 290, 535 225, 560 190
           C 575 170, 595 170, 605 185
           C 615 200, 610 220, 595 255
           C 570 315, 560 385, 565 440
           C 570 510, 555 570, 520 620
           C 490 655, 360 655, 330 630 Z"
        fill="rgba(25,27,35,0.75)" 
        stroke="rgba(229,196,107,0.4)" 
        stroke-width="2" 
        filter="url(#glow)"/>

  <!-- Mounts Radiance -->
  <!-- Jupiter Mount (Below index finger) -->
  <circle cx="325" cy="230" r="28" fill="rgba(229,196,107,0.12)" stroke="rgba(229,196,107,0.3)" stroke-width="1"/>
  <text x="325" y="234" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E5C46B" font-weight="600">♃ JUPITER</text>

  <!-- Saturn Mount (Below middle finger) -->
  <circle cx="405" cy="210" r="26" fill="rgba(229,196,107,0.08)" stroke="rgba(229,196,107,0.25)" stroke-width="1"/>
  <text x="405" y="214" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#CFC5B2" font-weight="600">♄ SATURN</text>

  <!-- Sun Mount (Below ring finger) -->
  <circle cx="480" cy="225" r="26" fill="rgba(229,196,107,0.12)" stroke="rgba(229,196,107,0.3)" stroke-width="1"/>
  <text x="480" y="229" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" fill="#E5C46B" font-weight="600">☉ SUN</text>

  <!-- Venus Mount (Base of thumb) -->
  <ellipse cx="270" cy="480" rx="45" ry="60" fill="rgba(229,196,107,0.1)" stroke="rgba(229,196,107,0.3)" stroke-width="1"/>
  <text x="270" y="484" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#FFE192" font-weight="600">♀ VENUS</text>

  <!-- Moon Mount (Base of outer palm) -->
  <ellipse cx="505" cy="510" rx="40" ry="55" fill="rgba(82,254,184,0.08)" stroke="rgba(82,254,184,0.3)" stroke-width="1"/>
  <text x="505" y="514" text-anchor="middle" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" fill="#52FEB8" font-weight="600">☽ MOON</text>

  <!-- Major Lines (Hastarekha Creases) -->
  <!-- Heart Line (Hridaya Rekha) -->
  <path d="M 550 330 C 470 335, 380 320, 325 245" 
        fill="none" stroke="url(#goldCrease)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Head Line (Shira Rekha) -->
  <path d="M 285 350 C 340 370, 440 395, 515 440" 
        fill="none" stroke="url(#jadeCrease)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Life Line (Jeevan Rekha) -->
  <path d="M 285 345 C 315 390, 325 480, 290 575" 
        fill="none" stroke="url(#goldCrease)" stroke-width="4.5" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Fate Line (Bhagya Rekha) -->
  <path d="M 390 600 C 395 500, 395 380, 405 240" 
        fill="none" stroke="rgba(255,225,146,0.65)" stroke-width="3" stroke-dasharray="8,4" stroke-linecap="round"/>

  <!-- Decorative Astrological Glyphs -->
  <circle cx="400" cy="380" r="8" fill="#52FEB8" opacity="0.6"/>
  <circle cx="400" cy="380" r="16" fill="none" stroke="#52FEB8" stroke-width="1" opacity="0.4"/>
</svg>
