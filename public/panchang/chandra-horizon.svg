<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818CF8" stop-opacity="0.35"/>
      <stop offset="75%" stop-color="#312E81" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="silverSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#C7D2FE"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="nightHorizon" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Atmospheric Night Horizon -->
  <rect y="160" width="400" height="80" fill="url(#nightHorizon)"/>
  <line x1="0" y1="180" x2="400" y2="180" stroke="#818CF8" stroke-opacity="0.3" stroke-dasharray="4 6"/>
  <line x1="20" y1="180" x2="380" y2="180" stroke="#C7D2FE" stroke-opacity="0.55" stroke-width="1.5"/>

  <!-- Chandra Glow Aura -->
  <circle cx="200" cy="135" r="110" fill="url(#moonGlow)"/>

  <!-- Celestial Rings & Lunar Orbit -->
  <circle cx="200" cy="135" r="78" stroke="#818CF8" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 5"/>
  <circle cx="200" cy="135" r="64" stroke="#C7D2FE" stroke-opacity="0.35" stroke-width="1.2"/>
  <circle cx="200" cy="135" r="50" stroke="#E0E7FF" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 16 Lunar Kala Phases Dots -->
  <g fill="#C7D2FE" opacity="0.7">
    <circle cx="200" cy="71" r="2"/>
    <circle cx="200" cy="199" r="2"/>
    <circle cx="136" cy="135" r="2"/>
    <circle cx="264" cy="135" r="2"/>
    <circle cx="155" cy="90" r="1.5"/>
    <circle cx="245" cy="180" r="1.5"/>
    <circle cx="155" cy="180" r="1.5"/>
    <circle cx="245" cy="90" r="1.5"/>
  </g>

  <!-- Crescent Moon Silhouette (Soma / Chandra) -->
  <g filter="drop-shadow(0 0 12px rgba(199,210,254,0.6))">
    <path d="M 216 102 C 235 118 235 152 216 168 C 196 156 190 124 204 105 C 208 103 212 102 216 102 Z" fill="#181B26" stroke="url(#silverSilver)" stroke-width="2"/>
    <path d="M 213 105 C 230 119 230 151 213 165 C 199 154 195 125 207 108 Z" fill="url(#silverSilver)" opacity="0.9"/>
  </g>

  <!-- Star of Rohini / Chitra beside Chandra -->
  <g transform="translate(162, 115) scale(0.8)">
    <polygon points="12,0 15,9 24,12 15,15 12,24 9,15 0,12 9,9" fill="#FFFFFF"/>
    <circle cx="12" cy="12" r="3" fill="#E0E7FF"/>
  </g>

  <!-- Constellation Ambient Stars -->
  <circle cx="50" cy="40" r="1.5" fill="#FFF" opacity="0.85"/>
  <circle cx="95" cy="65" r="1" fill="#C7D2FE" opacity="0.7"/>
  <circle cx="315" cy="30" r="1.8" fill="#FFF" opacity="0.9"/>
  <circle cx="355" cy="85" r="1.2" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="85" cy="130" r="0.9" fill="#C7D2FE" opacity="0.5"/>
  <circle cx="335" cy="140" r="1.3" fill="#FFF" opacity="0.75"/>
</svg>

